; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; The official PlatformIO espressif32 platform stopped at Arduino core 2.0.x, so we use the community
; maintained pioarduino platform, which has Arduino core 3.x. All versions are pinned, so the project
; keeps building the same way - update them deliberately and test.

[env:lolin32]
; pioarduino 55.03.312 = Arduino core 3.3.12 / ESP-IDF 5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = lolin32
framework = arduino
lib_ldf_mode = deep
board_build.partitions = no_ota.csv
monitor_speed = 115200

lib_deps =
	zinggjm/GxEPD2@1.6.9
	bblanchon/ArduinoJson@7.4.3
	tzapu/WiFiManager@2.0.17
